<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mama!</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(to right, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

/* Intro click box */
#clickBox {
    background-color: #ff69b4;
    color: white;
    padding: 30px 50px;
    font-size: 2em;
    border-radius: 15px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 0 20px #ff69b4;
    transition: transform 0.2s, box-shadow 0.2s;
}

#clickBox:hover {
    transform: scale(1.1);
    box-shadow: 0 0 40px #ff1493;
}

/* Main content hidden initially */
#mainContent {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    position: relative;
}

h1 {
    font-size: 3em;
    color: #fff;
    text-shadow: 2px 2px 5px #ff69b4;
    animation: bounce 1s infinite alternate;
    z-index: 2;
}

p {
    font-size: 1.5em;
    color: #fff;
    text-align: center;
    margin-top: 20px;
    animation: fadeIn 3s ease-in forwards;
    z-index: 2;
}

button {
    margin-top: 30px;
    padding: 10px 20px;
    font-size: 1.2em;
    border: none;
    border-radius: 10px;
    background-color: #ff69b4;
    color: white;
    cursor: pointer;
    z-index: 2;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.1);
}

@keyframes bounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-20px); }
}

@keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
}

/* Balloons */
.balloon {
    position: absolute;
    width: 50px;
    height: 70px;
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) translateX(0); }
    50% { transform: translateY(50vh) translateX(50px); }
    100% { transform: translateY(-10vh) translateX(-50px); }
}

/* Confetti */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0.8;
    top: -10px;
    animation: fall 3s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(100vh) rotate(360deg); }
}

/* Floating I ❤️ U messages */
.love-message {
    position: absolute;
    font-size: 2em;
    color: #ff1493;
    font-weight: bold;
    animation: rise 4s ease-in forwards;
    pointer-events: none;
}

@keyframes rise {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-50px) scale(1); opacity: 0; }
}

/* Sparkles, hearts, flowers animation */
.sparkle, .heart, .flower {
    position: absolute;
    font-size: 1.5em;
    animation: floatUp 5s ease-in-out forwards;
}

@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-50px) scale(1); opacity: 0; }
}
</style>
</head>
<body>

<!-- Intro click box -->
<div id="clickBox" onclick="showMainContent()">Click Here for a Surprise 🎁</div>

<!-- Main birthday content -->
<div id="mainContent">
    <h1>🎉 Happy Birthday Mama! 🎉</h1>
    <p>Wishing you a day filled with love, joy, and happiness. ❤️</p>
    <button onclick="surprise()">Click for Surprise 🎁</button>

    <!-- Balloons -->
    <div class="balloon" style="left: 10%; background-color: #ff6f61;"></div>
    <div class="balloon" style="left: 20%; background-color: #ffb347;"></div>
    <div class="balloon" style="left: 30%; background-color: #87ceeb;"></div>
    <div class="balloon" style="left: 40%; background-color: #da70d6;"></div>
    <div class="balloon" style="left: 50%; background-color: #ff69b4;"></div>
    <div class="balloon" style="left: 60%; background-color: #7fff00;"></div>
    <div class="balloon" style="left: 70%; background-color: #ffa500;"></div>
    <div class="balloon" style="left: 80%; background-color: #00ffff;"></div>
    <div class="balloon" style="left: 90%; background-color: #ff1493;"></div>
</div>

<script>
function showMainContent() {
    document.getElementById('clickBox').style.display = 'none';
    document.getElementById('mainContent').style.display = 'flex';
    
    // Start adding random floating hearts, flowers, sparkles continuously
    setInterval(()=> {
        const types = ['✨','💖','🌸'];
        let element = document.createElement('div');
        let type = types[Math.floor(Math.random()*types.length)];
        element.textContent = type;
        element.classList.add(type==='💖'?'heart': type==='🌸'?'flower':'sparkle');
        element.style.left = Math.random() * 90 + 'vw';
        document.body.appendChild(element);
        setTimeout(()=> element.remove(), 5000);
    }, 300);
}

function surprise() {
    alert("🎉 Surprise! Happy Birthday Mom! 🎉");

    // Confetti
    for(let i=0;i<50;i++){
        let confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
        confetti.style.animationDuration = (Math.random()*3+2)+'s';
        document.body.appendChild(confetti);
        setTimeout(()=>{confetti.remove();},5000);
    }

    // Floating I ❤️ U Mama
    for(let i=0;i<5;i++){
        let love = document.createElement('div');
        love.classList.add('love-message');
        love.textContent = "I ❤️ U Mama!";
        love.style.left = Math.random()*80+'vw';
        love.style.animationDelay = (i*0.5)+'s';
        document.body.appendChild(love);
        setTimeout(()=>{love.remove();},4000);
    }
}
</script>
</body>
</html>
